# Wye context-graph schema. The parser (lib/parse.js) recognises these kinds and verbs.
# The kind list is open: base-ontology.md declares each kind as a type: card (properties, inverses) and a product may
# add its own types the same way; this file is the human-readable summary and must be kept in step with it.
# Ids are stable slugs: kind:slug. Slugs are kebab-case; req slugs are dotted paths (hierarchy).

kinds:
  action:         { purpose: something a user can do on a page }
  alternative:    { purpose: a way not taken — a child block of the decision that considered it, its text saying what it was and why not }
  choice:         { purpose: what was chosen, when a decision wants it as a block of its own under the decision rather than in its text }
  comment:        { purpose: a remark on a node — kept as a card in the Comments document of the node's project, never nested under the node, required: [on] }
  consequence:    { purpose: what follows from a decision — a child block of it }
  constraint:     { purpose: a rule about the product or how it is built that no code enforces — "local-first", "markdown is canonical" }
  context:        { purpose: what forced a decision — a child block of it }
  contradiction:  { purpose: two nodes that cannot both hold — found by the verdict pass or written by hand }
  decision:       { purpose: a choice that was made, in the person's words }
  drift:          { purpose: a contradiction between two nodes }
  entity:         { purpose: a persisted thing }
  flag:           { purpose: a runtime setting that changes behaviour }
  gate:           { purpose: a feature flag, permission policy or role check }
  goal:           { purpose: what the product or a project sets out to achieve }
  hook:           { purpose: "when this happens to that kind of node, do this" — a card in the project's Hooks document, required: [on, do] }
  lesson:         { purpose: procedural memory — "this broke because …", "here we always …" — learned in a session and kept for the next one, required: [statement] }
  module:         { purpose: a bounded area of the product; one document per module }
  note:           { purpose: a remark under a rule, a constraint or any node — a child block of it }
  op:             { purpose: a query, mutation, endpoint or tool — the public API surface }
  page:           { purpose: a screen the user can navigate to }
  pr:             { purpose: A Prompt Request — a person's request to change the knowledge, one page per request, required: [session] }
  product:        { purpose: a thing being built; groups projects }
  question:       { purpose: something the knowledge leaves unspecified; open until a person resolves it with a decision }
  rationale:      { purpose: why a constraint or a rule holds — a child block of it }
  req:            { purpose: what the product must do for someone, in the person's own words }
  rule:           { purpose: an invariant, constraint, validation or policy — how a behaviour is guaranteed }
  run:            { purpose: one run of a workflow: a document of its own under the project's Workflow runs page }
  scope:          { purpose: where a constraint or a rule applies, in words — a child block of it (ids go in the card's `scope:` links) }
  setting:        { purpose: alias of flag; the parser normalises setting: ids to flag: }
  skill:          { purpose: an instruction a session follows, kept as a document under the project's Skills page }
  stage:          { purpose: one step of a workflow, a card in its document }
  state:          { purpose: a state machine owned by an entity }
  statement:      { purpose: what a constraint or a rule says — a child block of it (decision:wf2.parts-are-content) }
  step:           { purpose: one stage of one run: a card in the run's page, written when the run starts so the whole chain is in the graph from the first moment, not only the stage it has reached }
  task:           { purpose: a unit of work for a human or agent — the work item every view lists and every worker takes }
  template:       { purpose: blocks a hook adds, as a card in the Hooks document: `body` is markdown with <node>, <slug>, <title>, <kind>, required: [body] }
  test:           { purpose: a verification, usually referenced as test:Class#Method }
  then:           { purpose: the outcome of a requirement — a child block of it }
  tool:           { purpose: an MCP tool or CLI command an agent can call }
  ui-test:        { purpose: an end-to-end spec }
  unless:         { purpose: the exception of a requirement — a child block of it }
  value:          { purpose: a value object or enum never persisted on its own }
  verdict:        { purpose: the verdict pass's classification of one pair }
  when:           { purpose: the trigger of a requirement — a child block of it }
  workflow:       { purpose: an ordered, gated pipeline a person runs on any node or document }

verbs:
  about:          lesson → node   (inverse: lessons)
  affects:        decision → node   (inverse: affected-by)
  applies-to:     gate → node   (inverse: gated-by)
  between:        contradiction → node   (inverse: contradicted-in)
  blocked-by:     task → task   (inverse: blocks)
  calls:          action | op → op   (inverse: called-by)
  content:        any → block   (inverse: parent)
  contradicts:    any → node   (inverse: contradicts)
  depends-on:     any | task → node | task   (inverse: depended-on-by)
  embedded-in:    entity → entity   (inverse: embeds)
  gated-by:       module | op | page → gate   (inverse: gates)
  governed-by:    entity | op | page → rule   (inverse: governs)
  governs:        decision | rule → node   (inverse: governed-by)
  hooks:          pr → hook
  mentions:       any → node   (inverse: mentioned-by)
  navigates:      action → page   (inverse: reached-from)
  on:             comment → node   (inverse: comments)
  owns:           entity → state   (inverse: owned-by)
  pair:           verdict → node
  part-of:        any → node   (inverse: has)
  produced:       any | run → node   (inverse: produced-by)
  rationale:      constraint → decision   (inverse: rationale-for)
  reads:          op | page → node   (inverse: read-by)
  refines:        req → req   (inverse: refined-by)
  refs:           entity → entity   (inverse: referenced-by)
  related-to:     any → node   (inverse: related-to)
  resolves:       any → node   (inverse: resolved-by)
  runs-on:        run → node   (inverse: run-by)
  satisfied-by:   req → node   (inverse: satisfies)
  scope:          constraint → node   (inverse: constrained-by)
  see:            any → node   (inverse: seen-from)
  set-by:         state → node   (inverse: sets)
  skills:         hook | pr | skill | stage → skill
  stage:          run | step → stage   (inverse: stage-of)
  submodules:     module → module   (inverse: part-of)
  supersedes:     any → node   (inverse: superseded-by)
  verified-by:    req | rule → node   (inverse: verifies)
  workflow:       run → workflow   (inverse: runs)
  writes:         action | op → node   (inverse: written-by)

statuses:
  constraint:  [proposed, approved, retired]
  decision:    [proposed, approved, rejected, superseded]
  drift:       [drift]
  goal:        [proposed, on-track, at-risk, off-track, paused, complete, non-goal]
  hook:        [active, paused]
  node:        [proposed, approved, shipped, deprecated, superseded, retired]
  pr:          [draft, refining, approved, building, done, failed, cancelled]
  question:    [open, resolved, rejected]
  req:         [shipped, api-only, unverified, proposed, question, superseded]
  rule:        [proposed, shipped, deprecated, superseded]
  run:         [running, waiting, blocked, done, cancelled]
  step:        [todo, running, review, ready, done, skipped, blocked]
  task:        [todo, open, in-progress, blocked, review, done]
  workflow:    [active, paused]

goal-and-task-properties: |
  Goals and tasks carry their tracking fields in the trailing property group: `(owner: alex, target: 2026-10, progress: 40)`.
  `target`/`due` is a date or month, `owner` a person, `progress` an explicit percentage; without `progress` the UI
  computes it from the nodes that are `part of` the goal (tasks, requirements, sub-goals) counting done/shipped/complete.
  A document may hold a goals or tasks table: the lines between `<!-- goals -->` and `<!-- /goals -->` (or `tasks`)
  are ordinary goal/task lines to the parser and an editable table in the UI.

aliases:   # short kind prefixes accepted anywhere an id is written; normalised to the full kind
  et: entity
  rq: req
  rl: rule
  pg: page
  st: state
  dc: decision
  qn: question
  vl: value
  ac: action
  gt: gate
  fl: flag
  tk: task
  gl: goal

prose-nodes: |
  A paragraph or list item whose first token is an id defines that node: `req:sale.close When a sale …`.
  The text after the id is the node's `text` (title = first sentence). `#status` at the END of the text sets status
  (a hashtag inside a sentence is text; `#ready` the same). A trailing
  `(key: value, key: value)` group carries other keys. Links `[phrase](kind:slug)` and bare ids in the text become
  edges; the verb is inferred from the words before the id ("satisfied by", "verified by", "refines", …), else related-to.
  A yaml block still defines nodes exactly as before; both forms coexist in one file.

conventions:
  - every rule cites `source: path[:line | #Symbol]`; a rule without a source is a wish, not a fact (wye check errors on it)
  - source paths resolve against the module's `source-roots` frontmatter list, in order
  - money is always base units (pence); quantities are always a value object {quantity, unitOfMeasure}
  - a req whose behaviour you could not find in code gets status proposed or question — never shipped
  - the drift table is mandatory; an empty one means you did not compare PRD, server, client and tests
