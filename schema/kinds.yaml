# Waterfall context-graph schema. The parser (lib/parse.js) recognises these kinds and verbs.
# Ids are stable slugs: kind:slug. Slugs are kebab-case; req slugs are dotted paths (hierarchy).

kinds:
  product:  { purpose: a thing being built; groups projects (repos). v2 — one node per product, described in the project file, required: [description, projects] }
  module:   { purpose: a bounded area of the product; one file per module,      required: [purpose, submodules] }
  req:      { purpose: a BEHAVIOUR — when <trigger>, <actor/system> <outcome> [unless <exception>]. Root of every feature,
              required: [title, when, then, status, satisfied-by], recommended: [verified-by, refines, unless, note] }
  flag:     { purpose: a runtime setting that changes behaviour (location setting, per-item toggle). NOT a feature flag — that is a gate,
              required: [scope, source] }
  entity:   { purpose: a persisted thing (collection or embedded document),    required: [description, fields, source], recommended: [collection, key-prefix, computed, edges] }
  value:    { purpose: value object or enum never persisted on its own,        required: [source] }
  state:    { purpose: a state machine owned by an entity,                     required: [owner, states, transitions] }
  op:       { purpose: a GraphQL query/mutation, REST endpoint, MCP tool — the public API surface, required: [args, does, gate, source] }
  page:     { purpose: a screen the user can navigate to,                      required: [route, component, actions], recommended: [vm, roles, reads, display-rules] }
  action:   { purpose: something a user can do on a page. Defined inline under a page's actions list, required: [does] }
  rule:     { purpose: an invariant / constraint / validation / policy. HOW a behaviour is guaranteed, required: [statement, source], recommended: [verified-by, contradicts, note] }
  gate:     { purpose: feature flag, permission policy, role check,             required: [applies-to or source] }
  test:     { purpose: a verification. Usually referenced (test:Class#Method) rather than described; the table in §Verification describes the important ones }
  ui-test:  { purpose: an end-to-end spec }
  drift:    { purpose: a contradiction between two nodes. Rows of the Drift table become drift:<module>.<n> nodes with contradicts edges }
  question: { purpose: behaviour the code leaves unspecified }
  decision: { purpose: an ADR — date, context, options, choice, consequences }
  goal:     { purpose: what the product or a project sets out to achieve; usually a prose node (`goal:<mod>.g1 Every tap is instant …`), #non-goal marks explicit exclusions; requirements refine goals }
  task:     { purpose: a unit of work for a human or agent. Usually a prose node on a checklist line (`- [ ] task:slug Do the thing`); the checkbox sets status open/done, #in-progress or #blocked override; part-of / implements name what it serves }
  field:    { purpose: GENERATED by the parser from every entity's fields/computed block. Never hand-write these }

verbs:
  refines:      req → parent req
  satisfied-by: req → rule | op | action | page | entity | state  (the mechanism that delivers the behaviour)
  verified-by:  req | rule → test | ui-test
  governed-by:  entity | op | action | page → rule
  gated-by:     op | page | action | module → gate
  has:          entity → field ; page → action ; module → submodule
  refs:         entity → entity   (reference by id)
  owns:         entity → state
  typed-as:     field → value | entity   (generated)
  calls:        action | op → op
  reads:        page | op → op | entity
  writes:       op | action → entity
  navigates:    action → page
  triggers:     external event / other module → rule | op
  contradicts:  drift | rule → node   (must be resolved before building on either side)
  edge-to:      module → module   (boundary; described only at the border)
  part-of:      module → module   (a document declares its parent document; the inverse of has, used for the document tree)
  related-to:   any → any         (a link on a phrase or a bare id inside a prose node whose preceding words name no verb)
  produced:     task → module     (documents a session produced while working on the task; written by the app as `(session: id, produced: module:x)`)
  see:          req → req          (alias, no duplication)
  mentions:     generated — any node whose text names another node or a field; weak edge, hidden by default in the viewer

statuses:
  req:  [shipped, api-only, unverified, proposed, question]   # shipped requires ≥1 verified-by; ctx check --strict enforces it
  node: [proposed, approved, shipped, deprecated]              # lifecycle used by deltas
  goal: [proposed, on-track, at-risk, off-track, paused, complete, non-goal]   # goal health, Atlassian-style; progress is computed from what is part of the goal
  task: [todo, open, in-progress, blocked, done]              # a checkbox line sets open/done; #in-progress / #blocked override
  drift: [drift]

goal-and-task-properties: |
  Goals and tasks carry their tracking fields in the trailing property group: `(owner: alex, target: 2026-10, progress: 40)`.
  `target`/`due` is a date or month, `owner` a person, `progress` an explicit percentage; without `progress` the UI
  computes it from the nodes that are `part of` the goal (tasks, requirements, sub-goals) counting done/shipped/complete.
  A document may hold a goals or tasks table: the lines between `<!-- goals -->` and `<!-- /goals -->` (or `tasks`)
  are ordinary goal/task lines to the parser and an editable table in the UI.

aliases:   # short kind prefixes accepted anywhere an id is written; normalised to the full kind
  et: entity
  rq: req
  rl: rule
  pg: page
  st: state
  dc: decision
  qn: question
  vl: value
  ac: action
  gt: gate
  fl: flag
  tk: task
  gl: goal

prose-nodes: |
  A paragraph or list item whose first token is an id defines that node: `req:sale.close When a sale …`.
  The text after the id is the node's `text` (title = first sentence). `#status` sets status. A trailing
  `(key: value, key: value)` group carries other keys. Links `[phrase](kind:slug)` and bare ids in the text become
  edges; the verb is inferred from the words before the id ("satisfied by", "verified by", "refines", …), else related-to.
  A yaml block still defines nodes exactly as before; both forms coexist in one file.

conventions:
  - every rule cites `source: path[:line | #Symbol]`; a rule without a source is a wish, not a fact (ctx check errors on it)
  - source paths resolve against the module's `source-roots` frontmatter list, in order
  - money is always base units (pence); quantities are always a value object {quantity, unitOfMeasure}
  - a req whose behaviour you could not find in code gets status proposed or question — never shipped
  - the drift table is mandatory; an empty one means you did not compare PRD, server, client and tests
