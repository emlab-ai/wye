# Publishes @emlab/wye to npm when a GitHub release is published: the version comes from the release tag
# (v0.3.0 → 0.3.0), the tests run, `prepack` builds the app (packages/web/.next and the externals list,
# scripts/externals-manifest.js), and npm publishes it with provenance. Run it by hand (Actions › Publish to npm ›
# Run workflow) for a dry run: everything but the upload.
#
# No token needed once npm's Trusted Publishing trusts this workflow by its GitHub OIDC identity (npmjs.com › @emlab/wye ›
# Settings › Trusted publishing: emlab-ai/wye, publish.yml). It needs npm 11.5.1 or later.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack, but do not publish
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # Trusted Publishing and provenance: npm checks which workflow run is publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # CI does not open the window: `wye app` fetches Electron's binary where it runs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: npm with Trusted Publishing (11.5.1+)
        run: npm install -g npm@latest

      - run: npm ci --no-audit --no-fund

      - name: Version from the release tag
        if: github.event_name == 'release'
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - run: npm test

      - name: Publish
        if: github.event_name == 'release' || inputs.dry-run == false
        run: npm publish
        env:
          # only until Trusted Publishing is set up on npmjs.com; npm prefers the workflow's OIDC identity when it is
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --dry-run
